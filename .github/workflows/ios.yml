name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

# Keep the simulator gate independent of Supabase, a camera, or an Apple ID.
jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios/HandStrudel
    env:
      SCHEME: HandStrudel
      PROJECT: HandStrudel.xcodeproj
      TEST_RUNNER_HANDSTRUDEL_OFFLINE_SMOKE: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Create a simulator for the pinned Xcode runtime
        run: |
          device_id="$(xcrun simctl create HandStrudelCI com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$SIMULATOR_RUNTIME")"
          printf 'SIMULATOR=platform=iOS Simulator,id=%s\n' "$device_id" >> "$GITHUB_ENV"

      - name: Run unit tests and Studio smoke tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$SIMULATOR" \
            -only-testing:HandStrudelTests \
            -only-testing:HandStrudelUITests/HandStrudelUITests/testMusic_startsSession \
            -only-testing:HandStrudelUITests/HandStrudelUITests/testOnboarding_gotItDismisses \
            -only-testing:HandStrudelUITests/HandStrudelUITests/testSounds_showsMusicSettings \
            -only-testing:HandStrudelUITests/HandStrudelUITests/testMusicSettingsDashboardShowsOnlyTheSelectedControls \
            -only-testing:HandStrudelUITests/HandStrudelUITests/testFeedSearchOpensWithoutAccount \
            -only-testing:HandStrudelUITests/HandStrudelUITests/testMusic_privateDraftsOpensWithoutAccount \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/HandStrudel/TestResults.xcresult
          if-no-files-found: ignore
