name = "handstrudel-clip-media"
main = "worker.mjs"
compatibility_date = "2026-04-23"
workers_dev = false
preview_urls = false
routes = [{ pattern = "clips.handstrudel.com", custom_domain = true }]

[vars]
SUPABASE_URL = "https://eygrtqbtbhktptphqdnn.supabase.co"
MEDIA_CACHE_TTL_SECONDS = "3600"

[[r2_buckets]]
binding = "PRIVATE_VIDEOS"
bucket_name = "handstrudel-video-staging"

[triggers]
crons = ["*/2 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
persist = true
