name: HandStrudel
options:
  bundleIdPrefix: com.handstrudel
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  HandStrudel:
    type: application
    platform: iOS
    sources:
      - path: HandStrudel
        excludes:
          - "*.xcassets/AppIcon.appiconset"
    resources:
      - path: HandStrudel/Assets.xcassets
      - path: HandStrudel/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handstrudel.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: "HandStrudel uses the camera to track your hand gestures and convert them into music."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "HandStrudel needs microphone access for audio processing."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: true
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
