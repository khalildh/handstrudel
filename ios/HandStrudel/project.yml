name: HandStrudel
options:
  bundleIdPrefix: com.handstrudel
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  HandStrudel:
    type: application
    platform: iOS
    sources:
      - path: HandStrudel
        excludes:
          - "*.xcassets/AppIcon.appiconset"
    resources:
      - path: HandStrudel/Assets.xcassets
      - path: HandStrudel/Resources
      - path: HandStrudel/PrivacyInfo.xcprivacy
    info:
      path: HandStrudel/Info.plist
      properties:
        CFBundleDisplayName: HandStrudel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "HandStrudel uses the camera to track your hand gestures and convert them into music."
        NSMicrophoneUsageDescription: "HandStrudel needs microphone access for audio processing."
        LSApplicationQueriesSchemes:
          - instagram-stories
          - instagram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handstrudel.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TVAG3T3Y65
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HandStrudelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HandStrudelTests
    dependencies:
      - target: HandStrudel
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
